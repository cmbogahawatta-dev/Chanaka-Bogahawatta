<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with smooth rounded squircle corners for iOS style -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#334155" stroke-width="4" opacity="0.5"/>

  <!-- Glowing Emblem Circle -->
  <circle cx="256" cy="256" r="170" fill="#0f172a" stroke="#1e293b" stroke-width="6" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#blueGrad)" stroke-width="3" opacity="0.4"/>

  <!-- Truck and Speed Graphic Symbol -->
  <g transform="translate(136, 156)">
    <!-- Speed Trail Lines -->
    <path d="M-20 40 L40 40" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M-35 65 L25 65" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <path d="M-15 90 L50 90" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

    <!-- Truck Cargo Body -->
    <rect x="30" y="20" width="120" height="110" rx="14" fill="url(#blueGrad)"/>
    
    <!-- Truck Cabin -->
    <path d="M150 50 L185 50 C198 50 206 58 212 68 L225 95 C228 102 230 110 230 118 L230 130 C230 135 226 140 220 140 L150 140 Z" fill="url(#accentGrad)"/>
    
    <!-- Cabin Window -->
    <path d="M160 62 L185 62 C190 62 195 66 198 72 L208 92 C210 95 208 98 204 98 L160 98 Z" fill="#0f172a"/>

    <!-- Wheels -->
    <circle cx="75" cy="140" r="28" fill="#0f172a" stroke="#64748b" stroke-width="7"/>
    <circle cx="75" cy="140" r="12" fill="#38bdf8"/>

    <circle cx="185" cy="140" r="28" fill="#0f172a" stroke="#64748b" stroke-width="7"/>
    <circle cx="185" cy="140" r="12" fill="#38bdf8"/>

    <!-- Headlight beam -->
    <polygon points="230,115 265,105 265,135" fill="#facc15" opacity="0.8"/>
  </g>
</svg>
